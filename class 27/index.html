<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopKart</title>
    <link rel="stylesheet" href="style.css">
<!-- icon links -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- fonts-links -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

</head>
<body>
    <!-- header-sections -->

    <header class="header">
        <div class="ShopLogo">
            <i class="fa-solid fa-shop"></i>
            <h1 class="logo">Shop<span class="kart">Kart</span></h1>
        </div>

        <!-- navbar -->
         <nav class="navbar">
            <ul class="list">
                <li><a href="#home">home</a></li>
                <li><a href="#shop">shop</a></li>
                <li><a href="#about">about</a></li>
                <li><a href="#contact">contact</a></li>
            </ul>
         </nav>

         <!-- icon-secton -->
          <div class="icon">
            <div class="inpusearch">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="search Products">
            </div>
            <a href="#admin.html"><i class="fa-solid fa-user"></i></a>
            <span><a href="#cart.html"  class="cartCount" style="text-decoration: none;">0</a></span>
          </div>

          <!-- menu -->
           <div class="menu">
            <span class="first common"></span>
            <span class="second common" style="width: 30px;"></span>
            <span class="third common"></span>
           </div>
    </header>


    <!-- hero-sections -->

    <main id="main">
        <section class="hero-section">
          <div class="hero-content">
              <div class="left">
                <div class="content">
                    <span class="heading">best deals online</span>
                    <h1 class="title">upgrade your <br>style today</h1>
                    <p class="description">discover the latest product trends in fashion, electronics, <br> home & more --  all in one place.</p>
                    <button class="shop-now">Shop know <i class="fa-solid fa-arrow-right-long"></i></button>
                </div>
            </div>
            <div class="right">
                <div class="hero-image">
                    <img src="images/hero-image.png" alt="">
                </div>
            </div>
          </div>
        </section>

        <!-- categorysections -->
         <section class="category">
       <div class="category-box">
            <div class="one">
                <i class="fa-solid fa-mobile-screen"></i>
                <p class="mobile">Mobile</p>
            </div>
            <div class="one two">
               <i class="fa-solid fa-laptop"></i>
                <p class="mobile">Laptop</p>
            </div>
            <div class="one three" >
         <i class="fa-solid fa-headphones" ></i>
                <p class="mobile">HeadPhone</p>
            </div>
            <div class="one four">
             <i class="fa-regular fa-clock"></i>
                <p class="mobile">Watches</p>
            </div>
            <div class="one five">
                <i class="fa-solid fa-shirt"></i>
                <p class="mobile">Fashion</p>
            </div>
            <div class="one six">
          <i class="fa-solid fa-person-shelter"></i>
                <p class="mobile">Living</p>
            </div>
            <div class="one seven">
                <i class="fa-brands fa-itch-io"></i>
                <p class="mobile">Gaming</p>
            </div>
            <div class="one eight">
               <i class="fa-solid fa-shoe-prints"></i>
                <p class="mobile">Shoes</p>
            </div>
            <div class="one nine">
               <i class="fa-solid fa-bag-shopping"></i>
                <p class="mobile">Bags</p>
            </div>
       </div>
         </section>

         <!-- feauture- products -->

          <section class="featured-section">

        <!-- Section Heading -->
        <div class="section-heading">
            <h2>Featured Products</h2>

            <a href="#">View All <i class="fa-solid fa-arrow-right"></i></a>
        </div>

        <!-- Products Container -->
        <div class="products-container">

              <!-- Product Image -->
  


    </section>
    </main>

    <script src="main.js"></script>
</body>
</html>
