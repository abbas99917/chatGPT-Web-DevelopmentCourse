<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checked Out</title>
    <link rel="stylesheet" href="checked.css">
       <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>
<body>
    


<main class="checkout-container">

    <div class="checkout-heading">
        <h1>Checkout</h1>
        <p>Complete your order by providing your details below.</p>
    </div>

    <div class="checkout-layout">

        <!-- Customer Information -->
      <form class="checkedoutForm">
          <section class="checkout-form">

            <div class="form-section">
                <h2>01. Contact Information</h2>


                <!-- name input -->
                <div class="input-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName"placeholder="Enter your full name">
                </div>


                <!-- mail input -->
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email"placeholder="Enter your email">
                </div>


                <!-- phone input -->
                <div class="input-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone"placeholder="03XX-XXXXXXX">
                </div>

            </div>


<!-- ======================================================== -->


            <!-- Shipping Address -->
            <div class="form-section">
                <h2>02. Shipping Address</h2>


                <!-- address input -->
                <div class="input-group">
                    <label for="address">Street Address</label>
                    <input type="text" id="address"placeholder="House number, street name">
                </div>



                <div class="input-row">
                    <!-- city -->
                    <div class="input-group">
                        <label for="city">City</label>
                        <input type="text" id="city"placeholder="Your city">
                    </div>


                        <!-- postalCode -->
                    <div class="input-group">
                        <label for="postal">Postal Code</label>
                        <input type="text" id="postal" placeholder="Postal code">
                    </div>
                </div>

                <!-- instructions field -->

                <div class="input-group">
                    <label for="notes">Order Notes (Optional)</label>
                    <textarea id="notes"placeholder="Any special instructions?"></textarea>
                </div>
            </div>

            <!-- ======================================================= -->


            <!-- Payment Method -->
            <div class="form-section">
                <h2>03. Payment Method</h2>

                <label class="payment-option">
                <input type="radio" name="payment"value="cod" checked>

                    <span>
                        <strong>Cash on Delivery</strong>
                        <small>Pay when your order arrives.</small>
                    </span>

                    <i class="fa-solid fa-money-bill-wave"></i>
                </label>
            </div>
        </section>
      </form>

        <!-- ======================================================= -->



        <!-- Order Summary -->
        <aside class="order-summary">

            <h2>Order Summary</h2>

            <div class="checkout-products">
                <!-- Products will render here -->
            </div>

            <div class="summary-line">
                <span>Subtotal</span>
                <strong class="checkout-subtotal">Rs 0</strong>
            </div>

            <div class="summary-line">
                <span>Shipping</span>
                <strong class="checkout-shipping">Rs 0</strong>
            </div>

            <div class="summary-line grand-total-line">
                <span>Grand Total</span>
                <strong class="checkout-grand-total">Rs 0</strong>
            </div>

            <button type="button" class="place-order-btn">
                Place Order
                <i class="fa-solid fa-arrow-right"></i>
            </button>

            <p class="secure-message">
                <i class="fa-solid fa-lock"></i>
                Your information is kept secure.
            </p>

        </aside>
        <!-- backtocart -->
        <a href="../cart.html" class="back-to-cart">
        <i class="fa-solid fa-arrow-left"></i>
         Back to Cart</a>
    </div>

</main>

<script src="checkout.js"></script>
</body>
</html>
