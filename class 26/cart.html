<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cart page</title>
    <link rel="stylesheet" href="style.css">

       <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    
<!-- Cart - headaer-sections -->

      <header class="header">
        <div class="logo">Shop<span class="orang">Cart</span></div>

        <nav class="navbar">
            <ul class="list">
                <li><a href="#">Home</a></li>
                <li><a href="#Shop">Shop</a></li>
                <li><a href="#category">Category</a></li>
                <li><a href="#Deals">Deals</a></li>
                <li><a href="#Contact">Contact</a></li>
            </ul>
        </nav>
        <div class="icons">
            
            <span><a href="cart.html"  class="count" style="text-decoration: none; color: white;">0</a></span>

            <div class="menu">
            <span class="first same"></span>
            <span class="second same" style="width: 25px;"></span>
            <span class="third same"></span>
        </div>
        </div>
      </header>



      <!-- cart-hero-sections -->

      <section class="cart-hero">

        <div class="cart-parent">
          
      
        </div>
      </section>


      <!-- summery -->

<section class="cart-layout">

    <div class="cart-parent">
        <!-- Cart products yahan render honge -->
    </div>

    <aside class="order-summary">
        <h2>Order Summary</h2>

        <div class="summary-row">
            <span>Total Products</span>
            <span class="total-items"></span>
        </div>

        <div class="summary-row">
            <span>Subtotal</span>
            <span class="subtotal"></span>
        </div>

        <div class="summary-row">
            <span>Shipping</span>
            <span class="shipping"></span>
        </div>

        <hr>

        <div class="summary-row final-row">
            <strong>Grand Total</strong>
            <strong class="grand-total"></strong>
        </div>

        <button class="checkout-btn">Proceed to Checkout</button>
    </aside>

</section>

<!-- taost notifications -->
 <div class="toast">
    <i class="fa-solid fa-circle-check"></i>
    <p>Transaction Successfully Done</p>
 </div>

      <script src="cart.js"></script>
</body>
</html>
