<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager App</title>

    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

    <div class="app-container">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="logo">
                <i class="fa-solid fa-list-check"></i>
                <h2>TaskFlow</h2>
            </div>

            <nav class="sidebar-nav">
                <a href="#" class="active">
                    <i class="fa-solid fa-house"></i>
                    Dashboard
                </a>

                <a href="#">
                    <i class="fa-solid fa-list"></i>
                    All Tasks
                </a>

                <a href="#">
                    <i class="fa-solid fa-clock"></i>
                    Pending
                </a>

                <a href="#">
                    <i class="fa-solid fa-circle-check"></i>
                    Completed
                </a>
            </nav>

            <div class="sidebar-bottom">
                <p>Stay productive!</p>
                <span>Organize your daily work.</span>
            </div>

        </aside>


        <!-- Main Content -->
        <main class="main-content">

            <!-- Header -->
            <header class="top-header">

                <div>
                    <h1>My Dashboard</h1>
                    <p>Manage your daily tasks easily.</p>
                </div>

                <button class="theme-btn">
                    <i class="fa-solid fa-moon"></i>
                </button>

            </header>


            <!-- Stats Section -->
            <section class="stats-container">

                <div class="stat-card">
                    <div class="stat-icon total-icon">
                        <i class="fa-solid fa-list-check"></i>
                    </div>

                    <h3>Total Tasks</h3>
                    <h2 class="total">12</h2>
                </div>


                <div class="stat-card">
                    <div class="stat-icon pending-icon">
                        <i class="fa-solid fa-clock"></i>
                    </div>

                    <h3>Pending Tasks</h3>
                    <h2 class="pendingTask">5</h2>
                </div>


                <div class="stat-card">
                    <div class="stat-icon completed-icon">
                        <i class="fa-solid fa-circle-check"></i>
                    </div>

                    <h3>Completed Tasks</h3>
                    <h2 class="completedTask">7</h2>
                </div>

            </section>


            <!-- Add Task Section -->
            <section class="add-task-section">

                <h2>Add New Task</h2>

                <div class="task-input-container">

                    <input type="text" id="task-input" placeholder="Enter your task...">
                    <textarea id="task-description" placeholder="Enter task description..."></textarea>

                    <button class="add-btn">
                        <i class="fa-solid fa-plus"></i>
                        Add Task
                    </button>

                </div>

            </section>


            <!-- Tasks Section -->
            <section class="tasks-section">

                <div class="tasks-header">

                    <h2>My Tasks</h2>

                    <div class="search-box">
                        <i class="fa-solid fa-magnifying-glass"></i>

                        <input
                            type="text"
                            placeholder="Search tasks..."
                       class="search-task" >
                    </div>

                </div>


                <!-- Filters -->
                <div class="filter-buttons">

                    <button class="filter-btn active" data-filter="all">All</button>

                    <button class="filter-btn" data-filter="pending">Pending</button>

                    <button class="filter-btn" data-filter="completed">Completed</button>

                </div>


                <!-- Task List -->
                <div class="task-list"></div>

            </section>

        </main>

    </div>


    <script src="main.js"></script>

</body>
</html>
