<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page Class 20</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="logo">Abbas</div>
        <nav>
            <ul>
                <li><a href="#home">home</a></li>
                <li><a href="#about">about</a></li>
                <li><a href="#resume">resume</a></li>
                <li><a href="#portfolio">portfolio</a></li>
                <li><a href="#services">services</a></li>
                <li><a href="#contact">contact</a></li>
            </ul>
        </nav>
        <div class="icons">
            <i class="fa-brands fa-x-twitter"></i>
            <i class="fa-brands fa-facebook"></i>
            <i class="fa-brands fa-instagram"></i>
            <i class="fa-brands fa-linkedin"></i>
        </div>
    </header>


    <main class="main-sections">
        <section class="hero-section">
            <div class="left-content">
                <h3 class="title">crafting digital  experience with passion</h3>
                <p class="text">transforming ideas into elegant solutions  through creative desgin and  innovative development.</p>
                <div class="buttons">
                    <button class="work">View My Work</button>
                    <button class="connect">Let's Connect</button>
                </div>
                <div class="rating">
                    <div class="experience">
                        <h2>50+</h2>
                        <p>Years experience</p>
                    </div>
                    <div class="projectt">
                        <h2>100+</h2>
                        <p>Project Complete</p>
                    </div>
                    <div class="clients">
                        <h2>50+</h2>
                        <p>Happy Clients</p>
                    </div>
                </div>
            </div>
            <div class="right-content">
                <img src="https://img.magnific.com/free-photo/young-cute-woman-cap-glasses-posing-outside-showing-thumbs-up-high-quality-photo_114579-91847.jpg?semt=ais_hybrid&w=740&q=80" width="300px"  alt="">
            </div>
        </section>
    </main>

</body>
</html>
